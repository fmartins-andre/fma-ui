packages:
  - 'apps/*'
  - 'packages/*'

# lefthook's postinstall fetches its platform binary — explicitly trusted
# (pnpm blocks install scripts by default; this is the declarative opt-in
# instead of the one-off interactive `pnpm approve-builds`).
onlyBuiltDependencies:
  - lefthook

catalog:
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: ^7.0.2
  "@types/node": ^26.6.3
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  vite: ^8.3.1
  "@vitejs/plugin-react": ^6.1.1
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
