packages:
  - 'apps/*'
  - 'packages/*'

# Fail install when Node/pnpm are outside `engines` instead of only warning.
engineStrict: true

# pnpm blocks install scripts by default and fails install on any undecided
# one; this is the declarative decision instead of the interactive
# `pnpm approve-builds`. lefthook's postinstall fetches its platform binary;
# esbuild's (via storybook) only re-verifies the binary its optional deps
# already ship, so it stays off.
allowBuilds:
  lefthook: true
  esbuild: false

catalog:
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: ^7.0.2
  "@types/node": ^24.16.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  vite: ^8.3.1
  "@vitejs/plugin-react": ^6.1.1
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
