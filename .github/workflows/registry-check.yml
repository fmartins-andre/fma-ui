name: Registry Drift Check

on:
  pull_request:
    paths:
      - "packages/ui/src/**"
      - "packages/ui/scripts/**"
      - "packages/ui/package.json"
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/registry-check.yml"
  push:
    branches:
      - main

# Least privilege: jobs only read the repo. Actions are pinned to commit SHAs
# (tags can be moved); Dependabot keeps the SHAs and version comments current.
permissions:
  contents: read

jobs:
  drift-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Check registry.json / public/r are up to date

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Includes apps/web: its theme editor must keep a control for every
      # ThemeSchema setting (SETTINGS_COVERED in apps/web/src/theme-editor/editor.tsx).
      - name: Type-check all packages
        run: pnpm type-check

      - name: Unit tests (meta.json + story presence, pure-function tests)
        run: pnpm --filter @fma-ui/ui test

      - name: Build ui package (regenerates registry.json + public/r)
        run: pnpm --filter @fma-ui/ui build

      - name: Fail if generated output differs from what's committed
        run: |
          if git diff --quiet packages/ui/registry.json apps/web/public/r/; then
            echo "Registry is in sync."
          else
            echo "Registry out of sync with source. Run locally and commit:"
            echo "  pnpm --filter @fma-ui/ui build"
            git diff --name-only packages/ui/registry.json apps/web/public/r/
            git diff packages/ui/registry.json apps/web/public/r/
            exit 1
          fi

  theme-editor-e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Theme editor end-to-end tests

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium

      # Builds apps/web and serves the production output (see apps/web/playwright.config.ts).
      - name: Run apps/web e2e tests
        run: pnpm --filter web test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Build everything

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
