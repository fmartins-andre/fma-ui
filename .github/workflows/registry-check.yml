name: Registry Drift Check

on:
  # No path filter: these jobs are required status checks on main, and a filtered-out
  # workflow never reports, leaving the PR stuck on "Expected — waiting".
  pull_request:
  push:
    branches:
      - main

# Required by the registry generator and apps/web's build (packages/registry/src/env.ts):
# a repository variable (Settings → Secrets and variables → Actions → Variables).
env:
  FMA_UI_SITE_URL: ${{ vars.FMA_UI_SITE_URL }}

jobs:
  drift-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Check registry.json / public/r are up to date

    steps:
      - uses: actions/checkout@v4

      # version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Includes apps/web: its theme editor must keep a control for every
      # ThemeSchema setting (SETTINGS_COVERED in apps/web/src/theme-editor/editor.tsx).
      - name: Type-check all packages
        run: pnpm type-check

      - name: Unit tests (meta.json + story presence, pure-function tests)
        run: pnpm --filter @fma-ui/ui test

      - name: Build ui package (regenerates registry.json + public/r)
        run: pnpm --filter @fma-ui/ui build

      - name: Fail if generated output differs from what's committed
        run: |
          if git diff --quiet packages/ui/registry.json apps/web/public/r/; then
            echo "Registry is in sync."
          else
            echo "Registry out of sync with source. Run locally and commit:"
            echo "  pnpm --filter @fma-ui/ui build"
            git diff --name-only packages/ui/registry.json apps/web/public/r/
            git diff packages/ui/registry.json apps/web/public/r/
            exit 1
          fi

  theme-editor-e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Theme editor end-to-end tests

    steps:
      - uses: actions/checkout@v4

      # version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium

      # Builds apps/web and serves the production output (see apps/web/playwright.config.ts).
      - name: Run apps/web e2e tests
        run: pnpm --filter web test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Build everything

    steps:
      - uses: actions/checkout@v4

      # version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
